[build-system]
requires = ["flit_core >=3.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "escrow-mcp"
version = "0.1.0"
description = "Deterministic in-flight action verification and execution gate for autonomous AI agents via Model Context Protocol (MCP)."
readme = "README.md"
authors = [
    { name = "Escrow Team", email = "contact@lag.agency" }
]
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "action-gate", "escrow", "fraud-prevention"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
escrow-mcp = "escrow_mcp.server:main"

[project.urls]
Homepage = "https://escrow.lag.agency"
Repository = "https://github.com/escrow-security/escrow-mcp"
Documentation = "https://escrow.lag.agency"
